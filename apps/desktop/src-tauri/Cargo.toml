[package]
name = "beifeng-agent-desktop"
version = "0.1.0"
description = "BeiFeng Agent Desktop MVP"
authors = ["BeiFeng Agent"]
edition = "2021"

[lib]
name = "beifeng_agent_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
